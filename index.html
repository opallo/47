<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>47</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: "Black Ops One", system-ui, sans-serif;
    }

    .hero {
      position: fixed;
      top: 50%;
      left: 50%;
      width: max-content;
      transform: translate(-50%, -50%);
    }

    .hero-nav {
      position: absolute;
      padding-left: 20%;
      padding-right: 20%;
      top: 50%;
      left: 0;
      right: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 32px;
      white-space: nowrap;
      text-shadow: 0 0 4px #000, 0 0 8px #000;
      transform: translateY(calc(-50% + var(--float-y, 0px)));
    }

    .hero-nav a {
      padding: 8px 0;
      color: inherit;
      text-decoration: none;
    }

    .hero-nav a:hover,
    .hero-nav a:focus-visible {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .hero-number {
      margin: 0;
      font-size: clamp(8rem, 35vmin, 28rem);
      font-weight: 400;
      line-height: 1;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.75), transparent), #fff;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

  </style>
</head>
<body>
  <main class="hero" id="home">
   
    <h1 class="hero-number">47</h1>
  </main>
   <nav class="hero-nav" aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#box">Gallery</a>
      <a href="#action">Contact</a>
    </nav>
  <script>
    const nav = document.querySelector(".hero-nav");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let animationFrame;

    function floatNav(time) {
      const offset = Math.sin((time / 4000) * Math.PI * 2) * 10;
      nav.style.setProperty("--float-y", `${offset}px`);
      animationFrame = requestAnimationFrame(floatNav);
    }

    function updateMotion() {
      cancelAnimationFrame(animationFrame);
      nav.style.setProperty("--float-y", "0px");
      if (!reducedMotion.matches) {
        animationFrame = requestAnimationFrame(floatNav);
      }
    }

    reducedMotion.addEventListener("change", updateMotion);
    updateMotion();
  </script>
</body>
</html>
